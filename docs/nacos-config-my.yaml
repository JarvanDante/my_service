# ===== my 站点配置 =====
site_name: 漫隐

server:
  address:     ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

frontapi:
  address: ":8001"
backendapi:
  address: ":8002"

logger:
  level:  "all"
  stdout: true

# 本站点信息(代码里从 g.Cfg 读, 不写死)
site:
  id:       1
  code:     "my"
  currency: "CNY"
  timezone: "Asia/Shanghai"

# 响应扩展字段白名单(字段差异)。代码: siteconf.ExtraFields / PickExt / HasExtra
# /front/user/info 公共字段固定; 下列字段进 data.ext
response:
  user_info_extra:
    - bg_img
    - share_num
    - channel_name
    # - group_end_time

# 客服链接(/front/user/customer-url 读取)
customer:
  url: "https://example.com/kefu"

# 本站点数据库(多商户时改成各自的库)
database:
  default:
    link:  "pgsql:postgres:654321@tcp(127.0.0.1:5432)/my?sslmode=disable"
    debug: true

redis:
  default:
    address: "127.0.0.1:6379"
    db:      0

kafka:
  brokers: ["127.0.0.1:9092"]
  groupId: "my"

# 对象存储(本地 Docker MinIO API 映射 19000)
minio:
  endpoint:   "127.0.0.1:19000"
  accessKey:  "minioadmin"
  secretKey:  "minioadmin123"
  bucket:     "my-media"
  useSSL:     false
  publicURL:  "http://127.0.0.1:19000"
  publicRead: true

upload:
  image:
    mime: ["image/jpeg", "image/jpg", "image/png", "image/gif", "image/webp"]
    maxSize: 5120
  cover:
    mime: ["image/jpeg", "image/jpg", "image/png", "image/gif", "image/webp"]
    maxSize: 5120
  avatar:
    mime: ["image/jpeg", "image/jpg", "image/png", "image/webp"]
    maxSize: 2048
  video:
    mime: ["video/mp4", "video/quicktime", "video/x-matroska", "video/webm"]
    maxSize: 2097152
  multipart:
    partSize: 8388608
    presignExpire: 7200

# 封面/用户图 AES-128-ECB, 必须 16 字节, 与 H5 VITE_AES_BNC_KEY 相同
image_aes:
  key: "525202f9149e061d"
