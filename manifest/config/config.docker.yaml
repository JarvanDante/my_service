# Docker 容器内配置（mydocker / jarven）
# 一体化入口监听 :8000（含 /front /backend）；总后台控制面请用 my_manage_service:8003

server:
  address:     ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  # 默认 8MB; 发帖视频上限 600M。超限会以纯文本 r.ParseMultipartForm 返回, H5 JSON 解析失败
  clientMaxBodySize: 734003200

frontapi:
  address: ":8001"
backendapi:
  address: ":8002"

logger:
  level:  "all"
  stdout: true

site:
  id:       1
  code:     "my"
  currency: "CNY"
  timezone: "Asia/Shanghai"

response:
  user_info_extra:
    - bg_img
    - share_num
    - channel_name

database:
  default:
    link:  "pgsql:postgres:654321@tcp(postgres:5432)/my?sslmode=disable"
    debug: true

redis:
  default:
    address: "redis:6379"
    db:      0

kafka:
  brokers: ["kafka:29092"]
  groupId: "my_service"

minio:
  # 预签名/直链给浏览器：走宿主机映射
  endpoint:   "host.docker.internal:19000"
  accessKey:  "minioadmin"
  secretKey:  "minioadmin123"
  bucket:     "my-media"
  useSSL:     false
  publicURL:  "http://127.0.0.1:19000"
  publicRead: true

upload:
  image:
    mime: ["image/jpeg", "image/jpg", "image/png", "image/gif", "image/webp"]
    maxSize: 5120
  cover:
    mime: ["image/jpeg", "image/jpg", "image/png", "image/gif", "image/webp"]
    maxSize: 5120
  avatar:
    mime: ["image/jpeg", "image/jpg", "image/png", "image/webp"]
    maxSize: 2048
  video:
    mime: ["video/mp4", "video/quicktime", "video/x-matroska", "video/webm", "video/3gpp", "video/3gpp2", "video/x-m4v"]
    maxSize: 2097152
  multipart:
    partSize: 8388608
    presignExpire: 7200

# PaaS 媒资中心(容器内网)
paas:
  app_key: "ak_baee2346281a74bfb654425b"
  app_secret: "3cdcfe258d1854ed90facfaa9000b9e4a7f2c46f8cbc345ebd939868357880e9"
  media_base: "http://my_media:8004"
  media_admin_token: "488ac147a8b24d2b0541b24f4fdfb5f8b10c20129f6b46fcce6d2091094e872a"

# 播放网关(给浏览器的签名地址, 与 my_media/my_play 一致)
play_gateway:
  base_url: "http://127.0.0.1:8006"
  secret: "dev-play-secret-change-me"
  token_ttl_sec: 14400

# 封面/用户图 AES-128-ECB, 必须 16 字节, 与 H5 VITE_AES_BNC_KEY 相同
image_aes:
  key: "dafb787c76b5ce8a"

# 前台限流(Redis 固定窗口)。ip_* 登录前按客户端IP; user_* 登录后按用户ID。
# 阈值按站点真实流量调; 正常用户远达不到, 批量刷接口会触发 429。
front_ratelimit:
  ip_per_min: 300
  ip_per_hour: 5000
  user_per_min: 120
  user_per_hour: 1500
