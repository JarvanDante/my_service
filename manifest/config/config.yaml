# 一体化开发入口(根 main.go)使用的默认 server
server:
  address:     ":8000"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# 各独立二进制的监听地址(app/* 读取)
frontapi:
  address: ":8001"
backendapi:
  address: ":8002"

logger:
  level:  "all"
  stdout: true

# 本站点信息(与 Nacos 模板对齐; 本地无 Nacos 时生效)
site:
  id:       1
  code:     "my"
  currency: "CNY"
  timezone: "Asia/Shanghai"

# 响应扩展字段白名单(字段差异)。详见 docs/site-features-nacos.md
# /front/user/info → response.user_info_extra → data.ext
response:
  user_info_extra:
    - bg_img
    - share_num
    - channel_name
    # - group_end_time   # 需要时取消注释即可出现在 ext

# PostgreSQL(后台/总后台可指向只读副本, 进一步隔离对前台库的压力)
database:
  default:
    link:  "pgsql:postgres:654321@tcp(127.0.0.1:5432)/my?sslmode=disable"
    debug: true
  # replica:   # 可选: 后台走只读副本
  #   link: "pgsql:postgres:654321@tcp(127.0.0.1:5433)/my?sslmode=disable"

redis:
  default:
    address: "127.0.0.1:6379"
    db:      0

kafka:
  brokers: ["127.0.0.1:9092"]
  groupId: "my_service"

# 对象存储(本地 Docker MinIO: API 19000)
minio:
  endpoint:   "127.0.0.1:19000"
  accessKey:  "minioadmin"
  secretKey:  "minioadmin123"
  bucket:     "my-media"
  useSSL:     false
  publicURL:  "http://127.0.0.1:19000"
  publicRead: true

# 上传规则(maxSize 单位 KB)
upload:
  image:
    mime: ["image/jpeg", "image/jpg", "image/png", "image/gif", "image/webp"]
    maxSize: 5120
  cover:
    mime: ["image/jpeg", "image/jpg", "image/png", "image/gif", "image/webp"]
    maxSize: 5120
  avatar:
    mime: ["image/jpeg", "image/jpg", "image/png", "image/webp"]
    maxSize: 2048
  video:
    mime: ["video/mp4", "video/quicktime", "video/x-matroska", "video/webm"]
    maxSize: 2097152
  multipart:
    partSize: 8388608   # 默认分片 8MiB(非末片须 ≥ 5MiB)
    presignExpire: 7200 # 预签名有效秒数
